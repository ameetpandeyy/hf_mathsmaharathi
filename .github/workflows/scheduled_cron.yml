name: Heavy Load Batch Pipeline Cron

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST) using GitHub Actions unlimited public runners
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      exam_filter:
        description: 'Specific exam to run (or "all")'
        required: false
        default: 'all'

jobs:
  run-batch-pipeline:
    name: Execute Heavy Load Pipeline & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Integrity Tests
        run: |
          pytest tests/ -v

      - name: Execute Heavy Load Batch Cron
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EXAM_FILTER: ${{ github.event.inputs.exam_filter || 'all' }}
        run: |
          python cron/run_batch_pipeline.py

      - name: Archive Generated Export Packs
        uses: actions/upload-artifact@v4
        with:
          name: content-packs-${{ github.run_id }}
          path: |
            exports/
            logs/
          retention-days: 14
